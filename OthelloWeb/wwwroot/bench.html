<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OthelloWeb 計測</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
  label { display: block; margin: 6px 0; }
  textarea { width: 100%; height: 3em; }
  pre { background: #f4f4f4; padding: 8px; overflow-x: auto; font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>OthelloWeb 計測(Phase 1)</h1>
<p>Web Worker の中で .NET のAIを動かし、棋譜1局分の各局面で、AIが選ぶ手と思考時間を測る。</p>
<label>置換表 2^<input id="ttBits" type="number" value="20" min="10" max="26" style="width:4em"> 件 <button id="init">読み込む</button></label>
<label>棋譜(f5d6形式)<textarea id="transcript">f5d6c7f4f3f6c5e6f7g5e3d3h5g4c2c4g3c6b4d7d8c3b5c1b2g6d2e7h7b6e8f8a6e2g8b3e1d1a3f1f2a5a4a1a2h6h4g1g2h1h2b8b7h3a7b1h8c8g7</textarea></label>
<label>レベル(カンマ区切り)<input id="levels" value="1,3,5,6,8,10"> <button id="run" disabled>測る</button></label>
<p>AIが考えている間も動くか: <span id="clock">0</span></p>
<pre id="log"></pre>
<script type="module" src="bench.js"></script>
</body>
</html>
